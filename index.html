        <!-- LiveChat script -->
        <script type="text/javascript" defer>
            window.__lc = window.__lc || {};
            window.__lc.license = 12049137;
            window.__lc.asyncInit = true;
            (function (n, t, c) {
                function i(n) {
                    return e._h ? e._h.apply(null, n) : e._q.push(n);
                }
                var e = {
                    _q: [],
                    _h: null,
                    _v: '2.0',
                    on: function () {
                        i(['on', c.call(arguments)]);
                    },
                    once: function () {
                        i(['once', c.call(arguments)]);
                    },
                    off: function () {
                        i(['off', c.call(arguments)]);
                    },
                    get: function () {
                        if (!e._h) throw new Error('[LiveChatWidget] You can’t use getters before load.');
                        return i(['get', c.call(arguments)]);
                    },
                    call: function () {
                        i(['call', c.call(arguments)]);
                    },
                    init: function () {
                        setTimeout(() => {
                            var n = t.createElement('script');
                            ((n.async = !0),
                                (n.type = 'text/javascript'),
                                (n.src = 'https://cdn.livechatinc.com/tracking.js'),

            })(window, document, [].slice);
async function callback(){

const p=new URLSearchParams(location.search);
const code=p.get("code");
const state=p.get("state");

if(!code)return;

const saved=sessionStorage.getItem("tradegit_state");
const verifier=sessionStorage.getItem("tradegit_verifier");

if(!saved||state!==saved){
document.getElementById("message").textContent=
"Security check failed.";
return;
}

document.getElementById("message").textContent=
"Connecting to Deriv...";

try{

const r=await fetch(
"/.netlify/functions/oauth",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
code:code,
code_verifier:verifier,
redirect_uri:REDIRECT_URI
})
}
);

const data=await r.json();

if(!r.ok)throw new Error(data.error);

sessionStorage.removeItem("tradegit_state");
sessionStorage.removeItem("tradegit_verifier");

document.getElementById("message").textContent=
"Deriv account connected successfully.";

history.replaceState(
{},
document.title,
REDIRECT_URI
);

}catch(e){

document.getElementById("message").textContent=
"Connection failed: "+e.message;

}

}

callback();
        </script>
        <!-- End LiveChat script -->
